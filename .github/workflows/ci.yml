name: CI

# 机械验证门禁：后端单测 + 三前端构建
# 本文件仅在仓库推送到 GitHub 后生效；本地等效命令见各 job 的 run 步骤
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        working-directory: xiantao-server
        run: mvn -q test

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [xiantao-web, xiantao-admin, xiantao-miniprogram]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        working-directory: ${{ matrix.app }}
        run: |
          npm ci
          npm run build
