server:
  port: 8080

spring:
  application:
    name: xiantao-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xiantao?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    druid:
      connection-init-sqls:
        - SET NAMES utf8mb4
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xiantao.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: xiantao-jwt-secret-key-2024-second-hand-trading-platform
  expiration: 86400000

upload:
  path: E:/xiantao/uploads
  url-prefix: /uploads/

logging:
  level:
    com.xiantao: debug
